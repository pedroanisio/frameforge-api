name: CI

# Every gate this repository documents used to run only on a developer's
# laptop: `make check` existed and nothing enforced it. This is what enforces it.
#
# The suite must pass with NO sibling `frameforge` checkout — that is the whole
# point of extracting the contract into a leaf package, and the fidelity suite
# skips cleanly here by design. FRAMEFORGE_REPO is deliberately never set: it
# would turn those skips into failures (see tests/test_extraction_fidelity.py).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared by `requires-python`, and current.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The doc gates shell out to `git ls-files`; a shallow clone is fine,
          # but the checkout must be a real repository, not an export.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the dev environment
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      # Each step invokes a Makefile TARGET rather than respelling its command.
      # Spelling them out here meant `make check` and CI were two hand-written
      # lists of the same thing: adding a gate to the Makefile left CI running
      # the old set, and the new gate protected only whoever remembered to type
      # `make check`. `ci_mirrors_the_makefile_problems()` in tooling/docgates.py
      # fails the build if a step here stops being a `make` invocation.
      #
      # The targets are listed separately rather than as a single `make check`
      # so the matrix log shows which gate failed without opening the step.
      - name: Schema drift gate
        run: make schema-check

      - name: Doc drift gate
        run: make doc-check

      - name: Lint
        run: make lint

      - name: Tests
        # PYTEST_ADDOPTS rather than an argument, because the command belongs to
        # the Makefile. -rs prints skip reasons: a skipped gate is not a passing
        # gate, and the reason belongs in the log where someone can read it.
        env:
          PYTEST_ADDOPTS: -rs
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # `build-check` builds and then asserts the generated schema is inside the
      # wheel. The assertion used to live only here, which meant `make check`
      # could not catch a broken `force-include`; it is a Makefile target now,
      # so both environments run identical logic.
      - name: Build and verify the wheel contents
        run: make build-check

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
