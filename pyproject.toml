[project]
name = "frameforge-api"
# The PACKAGE version, which is deliberately NOT the contract version.
# `HEAD_VERSION` (2.8.x) is the FrameForge *document format* revision this
# package carries; this number is the distribution's own release line. Keeping
# them separate is what lets the package ship a packaging fix, a new helper or a
# CLI change without pretending the document contract moved — and lets the
# contract move without forcing a major bump here.
version = "1.2.0"
description = "The FrameForge v2 document contract — authoritative Pydantic models and the JSON Schema generated from them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva", email = "pedroanisio@gmail.com" }]
keywords = ["frameforge", "schema", "json-schema", "pydantic", "document-composition", "contract"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
# The whole point of this package: the contract is a leaf. One runtime
# dependency, no engine, no SDK — so anything can depend on it cheaply.
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# Only the `ff-schema <doc.yaml>` validation path needs a YAML parser; the
# models and the schema itself never do.
yaml = ["pyyaml>=6"]

[project.scripts]
ff-schema = "frameforge_api.schema:main"
# The migration path the contract's own error messages point at. It used to be
# `tooling/codemod.py` in the frameforge monorepo, which meant the advice was
# unactionable for anyone who installed this package on its own.
ff-codemod = "frameforge_api.deprecations:main"

[project.urls]
Repository = "https://github.com/pedroanisio/frameforge-api"
Issues = "https://github.com/pedroanisio/frameforge-api/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameforge_api"]

# The generated schema ships INSIDE the wheel so a consumer that never runs
# Python (a TS client, an editor linter, a CI validator) still gets the contract.
[tool.hatch.build.targets.wheel.force-include]
"src/frameforge_api/schema/frameforge-v2.schema.json" = "frameforge_api/schema/frameforge-v2.schema.json"

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/dist", "/htmlcov", "/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # long lines are the Field(...) documentation style
    "B017",     # tests assert on pydantic's ValidationError via Exception on purpose:
                # the contract is "this is rejected", not "rejected with this class"
]

# `frameforge_api/model/` holds VENDORED declarations: they came from the
# frameforge monorepo and a fidelity test asserts they still match it, one
# normalised AST per declaration. Restyling them (`Optional[X]` -> `X | None`,
# resorting imports, …) would break that identity and could shift the generated
# schema, so the STYLE rules are off there.
#
# The correctness rules stay on, and they earn their keep: splitting the module
# into a package is precisely the operation that can leave a name unimported,
# and `F821` caught exactly that (`FigureFlow.object`) on the first run. An
# earlier version of this config excluded the contract from linting outright,
# which would have let that through.
[tool.ruff.lint.per-file-ignores]
"src/frameforge_api/model/**/*.py" = [
    "UP007", "UP045", "UP037",     # PEP 604/585 restyling — would diverge from upstream
    "I001",                        # import order is upstream's, not ours
    "SIM102",                      # validator branches are written to mirror the spec's prose
    "RUF001", "RUF003",            # §, —, and other typography in the spec's own words
    "RUF022",                      # `__all__` order is upstream's; the golden compares it
]
# A package __init__ re-exports; that is what it is for.
"src/frameforge_api/model/__init__.py" = ["F401", "UP007", "UP045", "UP037", "I001", "RUF001", "RUF003", "RUF022"]
"src/frameforge_api/model/objects/__init__.py" = ["F401", "UP007", "UP045", "UP037", "I001", "RUF001", "RUF003"]
